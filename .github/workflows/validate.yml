name: Validate recipes

on:
  push:
    paths:
      - "_recipes/**"
      - "_data/units.yml"
      - "bin/validate_recipes.rb"
  pull_request:
    paths:
      - "_recipes/**"
      - "_data/units.yml"
      - "bin/validate_recipes.rb"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
      - name: Validate all recipes
        run: ruby bin/validate_recipes.rb --all
